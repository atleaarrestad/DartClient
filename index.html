<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Eye-share Dart</title>
	<script type="module">
		const routeStorageKey = 'gh-pages-route';
		const redirectPath = sessionStorage.getItem(routeStorageKey);

		if (redirectPath) {
			sessionStorage.removeItem(routeStorageKey);

			const restoredUrl = new URL(
				redirectPath.replace(/^\//u, ''),
				`${ window.location.origin }${ import.meta.env.BASE_URL }`,
			);

			history.replaceState(null, '', `${ restoredUrl.pathname }${ restoredUrl.search }${ restoredUrl.hash }`);
		}
	</script>
	<script type="module" src="./src/index.ts"></script>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
	<div class="app-container">
		<aa-navigationbar></aa-navigationbar>
		<div id="outlet"></div>
	</div>
</body>

</html>
